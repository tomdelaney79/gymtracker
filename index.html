<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 30px;
        }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .workout-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .workout-item:last-child {
            border-bottom: none;
        }

        .workout-info .exercise {
            font-weight: 600;
        }

        .workout-info .details {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 2px;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
            width: auto;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: #64748b;
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🏋️‍♂️ Gym Tracker</h1>
        
        <div class="card">
            <form id="workout-form">
                <div class="form-group">
                    <label for="exercise">Exercise Name</label>
                    <input type="text" id="exercise" placeholder="e.g., Bench Press" required>
                </div>
                <div class="form-group">
                    <label for="weight">Weight (kg/lbs)</label>
                    <input type="number" id="weight" placeholder="e.g., 80" required>
                </div>
                <div class="form-group">
                    <label for="reps">Reps</label>
                    <input type="number" id="reps" placeholder="e.g., 10" required>
                </div>
                <button type="submit">Log Workout</button>
            </form>
        </div>

        <h2>Workout History</h2>
        <div class="card" id="history-card">
            <div id="workout-list"></div>
        </div>
    </div>

    <script>
        // DOM Elements
        const workoutForm = document.getElementById('workout-form');
        const workoutList = document.getElementById('workout-list');

        // Load workouts from LocalStorage
        let workouts = JSON.parse(localStorage.getItem('workouts')) || [];

        // Function to render workouts to the screen
        function renderWorkouts() {
            workoutList.innerHTML = '';

            if (workouts.length === 0) {
                workoutList.innerHTML = '<div class="empty-state">No workouts logged yet. Get lifting!</div>';
                return;
            }

            workouts.forEach((workout, index) => {
                const item = document.createElement('div');
                item.className = 'workout-item';
                item.innerHTML = `
                    <div class="workout-info">
                        <div class="exercise">${workout.exercise}</div>
                        <div class="details">${workout.weight}kg × ${workout.reps} reps</div>
                    </div>
                    <button class="delete-btn" onclick="deleteWorkout(${index})">Delete</button>
                `;
                workoutList.appendChild(item);
            });
        }

        // Add a workout
        workoutForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const exercise = document.getElementById('exercise').value;
            const weight = document.getElementById('weight').value;
            const reps = document.getElementById('reps').value;

            const newWorkout = { exercise, weight, reps };
            workouts.push(newWorkout);

            // Save to local storage
            localStorage.setItem('workouts', JSON.stringify(workouts));

            // Reset form and refresh list
            workoutForm.reset();
            renderWorkouts();
        });

        // Delete a workout
        function deleteWorkout(index) {
            workouts.splice(index, 1);
            localStorage.setItem('workouts', JSON.stringify(workouts));
            renderWorkouts();
        }

        // Initial render on page load
        renderWorkouts();
    </script>
</body>
</html>
