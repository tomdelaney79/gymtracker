<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0d0d14"/>
<title>GymTracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0d0d14;
    --card: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #e2e8f0;
    --muted: #888;
    --dim: #555;
    --chest: #3b82f6;
    --shoulders: #a855f7;
    --legs: #f97316;
    --back: #22c55e;
    --orange: #f97316;
    --red: #ef4444;
    --green: #22c55e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

  /* Layout */
  #app { max-width: 600px; margin: 0 auto; padding: 20px 16px 80px; }
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .logo { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, #f97316, #ef4444); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
  .logo-text { font-weight: 800; font-size: 19px; color: #fff; letter-spacing: -0.5px; }
  .logo-date { font-size: 12px; color: var(--dim); }

  /* Bottom nav */
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13,13,20,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; z-index: 50; }
  .nav-btn { flex: 1; padding: 10px 4px 12px; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: inherit; font-size: 10px; font-weight: 600; color: var(--dim); transition: color 0.2s; }
  .nav-btn.active { color: #fff; }
  .nav-btn .nav-icon { font-size: 20px; }
  .nav-btn.active .nav-dot { width: 4px; height: 4px; background: var(--orange); border-radius: 50%; margin-top: 2px; }

  /* Tabs */
  .tab { display: none; } .tab.active { display: block; }

  /* Day selector */
  .day-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 14px; }
  .day-btn { padding: 9px 4px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; color: var(--dim); display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.2s; }
  .day-btn .day-emoji { font-size: 18px; }
  .day-btn.active-chest   { border-color: rgba(59,130,246,0.5); background: rgba(59,130,246,0.1); color: var(--chest); box-shadow: 0 0 14px rgba(59,130,246,0.2); }
  .day-btn.active-shoulders { border-color: rgba(168,85,247,0.5); background: rgba(168,85,247,0.1); color: var(--shoulders); box-shadow: 0 0 14px rgba(168,85,247,0.2); }
  .day-btn.active-legs    { border-color: rgba(249,115,22,0.5); background: rgba(249,115,22,0.1); color: var(--legs); box-shadow: 0 0 14px rgba(249,115,22,0.2); }
  .day-btn.active-back    { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.1); color: var(--back); box-shadow: 0 0 14px rgba(34,197,94,0.2); }

  /* Session bar */
  .session-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border-radius: 14px; padding: 13px 16px; border: 1px solid var(--border); margin-bottom: 14px; }
  .session-info { display: flex; align-items: center; gap: 12px; }
  .session-title { font-weight: 800; font-size: 16px; color: #fff; }
  .session-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .btn { padding: 9px 18px; border-radius: 10px; border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .btn:active { transform: scale(0.97); }
  .btn-start { color: #fff; }
  .btn-save { background: var(--red); color: #fff; }

  /* Exercise card */
  .ex-card { border-radius: 14px; border: 1px solid var(--border); background: var(--card); margin-bottom: 8px; overflow: hidden; transition: border-color 0.2s, background 0.2s; }
  .ex-card.done { }
  .ex-header { padding: 13px 14px; cursor: pointer; display: flex; align-items: center; gap: 11px; user-select: none; }
  .ex-check { width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.2); background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s; font-size: 14px; }
  .ex-name { font-weight: 700; font-size: 15px; color: #fff; }
  .ex-card.done .ex-name { text-decoration: line-through; color: #888; }
  .ex-stats { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .ex-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .ex-mood-badge { font-size: 17px; }
  .chevron { color: var(--dim); font-size: 14px; transition: transform 0.2s; }
  .ex-card.open .chevron { transform: rotate(180deg); }

  /* Expanded panel */
  .ex-body { display: none; border-top: 1px solid rgba(255,255,255,0.06); padding: 14px; background: rgba(0,0,0,0.15); }
  .ex-card.open .ex-body { display: block; }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .detail-cell { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 8px; text-align: center; }
  .detail-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }
  .detail-val { font-weight: 700; color: var(--text); font-size: 15px; }
  .weight-section { margin-bottom: 14px; }
  .section-label { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; }
  .weight-editor { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; background: rgba(255,255,255,0.07); border: 1px dashed rgba(255,255,255,0.18); cursor: pointer; }
  .weight-val { font-weight: 700; font-size: 16px; }
  .weight-unit { font-size: 12px; color: var(--muted); }
  .weight-edit-icon { font-size: 11px; color: var(--dim); }
  .weight-input-wrap { display: none; align-items: center; gap: 6px; }
  .weight-input-wrap.show { display: flex; }
  .weight-editor.hide { display: none; }
  .weight-input { width: 70px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--orange); background: #13131f; color: #fff; font-size: 15px; text-align: center; font-family: inherit; }
  .weight-note { font-size: 12px; color: var(--dim); margin-left: 8px; }
  .purpose-note { font-size: 12px; color: #777; font-style: italic; margin-bottom: 14px; }

  /* Mood picker */
  .mood-section { }
  .mood-prompt { font-size: 12px; color: var(--dim); font-style: italic; text-align: center; padding: 8px 0; }
  .mood-grid { display: flex; gap: 6px; }
  .mood-btn { flex: 1; padding: 8px 4px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all 0.15s; font-family: inherit; }
  .mood-btn:active { transform: scale(0.95); }
  .mood-btn .mood-emoji { font-size: 22px; }
  .mood-btn .mood-label { font-size: 9px; color: var(--dim); font-weight: 600; letter-spacing: 0.5px; }

  /* Progress ring */
  .ring-wrap { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
  .ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 10px; font-weight: 800; color: #fff; }

  /* History */
  .hist-card { border-radius: 14px; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 9px; }
  .hist-header { background: var(--card); padding: 13px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
  .hist-day { font-weight: 700; color: #fff; font-size: 14px; }
  .hist-date { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .hist-right { display: flex; align-items: center; gap: 10px; }
  .hist-count { font-size: 14px; font-weight: 700; }
  .hist-body { display: none; padding: 12px 14px; background: rgba(0,0,0,0.2); }
  .hist-card.open .hist-body { display: block; }
  .hist-card.open .chevron { transform: rotate(180deg); }
  .hist-ex { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; border-radius: 9px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); margin-bottom: 6px; }
  .hist-ex.done { }
  .hist-ex-left { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .hist-ex-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

  /* Reminders */
  .card { background: var(--card); border-radius: 14px; padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
  .card-title { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 12px; display: flex; align-items: center; gap: 7px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 9px; }
  .form-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; }
  .form-input { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid rgba(255,255,255,0.1); background: #13131f; color: #fff; font-size: 13px; font-family: inherit; }
  .form-input:focus { outline: none; border-color: var(--orange); }
  .btn-full { width: 100%; padding: 11px; border-radius: 10px; border: none; background: var(--orange); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; margin-top: 4px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stat-card { background: var(--card); border-radius: 13px; padding: 14px; border: 1px solid var(--border); }
  .stat-label { font-size: 10px; color: var(--dim); letter-spacing: 1px; margin-bottom: 5px; }
  .stat-val { font-weight: 700; color: #fff; font-size: 14px; }
  .stat-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .reminder-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); margin-bottom: 7px; }
  .reminder-item.today { background: rgba(249,115,22,0.08); border-color: rgba(249,115,22,0.25); }
  .reminder-day { font-weight: 600; color: #ccc; font-size: 14px; }
  .reminder-item.today .reminder-day { color: var(--orange); }
  .reminder-label { font-size: 12px; color: var(--muted); }
  .btn-remove { background: rgba(239,68,68,0.12); border: none; color: var(--red); border-radius: 8px; padding: 5px 11px; cursor: pointer; font-size: 12px; font-family: inherit; }

  /* Fasting */
  .fast-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .fast-title { font-weight: 800; font-size: 18px; color: #fff; }
  .fast-sub { font-size: 13px; color: var(--muted); }
  .streak-badge { display: flex; align-items: center; gap: 6px; background: rgba(249,115,22,0.1); padding: 6px 13px; border-radius: 20px; border: 1px solid rgba(249,115,22,0.25); font-weight: 700; color: var(--orange); font-size: 14px; }
  .fast-card { background: linear-gradient(135deg,#13131f,#0d0d14); border-radius: 20px; padding: 24px; border: 1px solid rgba(249,115,22,0.18); display: flex; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 14px; }
  .fast-ring { position: relative; width: 180px; height: 180px; }
  .fast-ring-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; width: 100%; }
  .fast-time { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1; }
  .fast-elapsed { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .fast-remaining { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .fast-reached { font-size: 12px; color: var(--green); font-weight: 700; margin-top: 4px; }
  .fast-windows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 310px; }
  .fast-window { border-radius: 11px; padding: 10px 12px; text-align: center; }
  .fast-window.start { background: rgba(249,115,22,0.08); border: 1px solid rgba(249,115,22,0.18); }
  .fast-window.eat { background: rgba(34,197,94,0.08); border: 1px solid rgba(34,197,94,0.18); }
  .fast-window-label { font-size: 10px; color: var(--muted); letter-spacing: 1px; }
  .fast-window-time { font-weight: 700; font-size: 16px; }
  .fast-window.start .fast-window-time { color: var(--orange); }
  .fast-window.eat .fast-window-time { color: var(--green); }
  .fast-window-sub { font-size: 11px; color: var(--dim); }
  .btn-fast { padding: 13px 36px; border-radius: 13px; border: none; color: #fff; font-weight: 800; font-size: 15px; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .protocol-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .protocol-card { border-radius: 12px; padding: 13px; text-align: center; }
  .protocol-card.fast-p { background: rgba(249,115,22,0.07); border: 1px solid rgba(249,115,22,0.15); }
  .protocol-card.eat-p { background: rgba(34,197,94,0.07); border: 1px solid rgba(34,197,94,0.15); }
  .protocol-icon { font-size: 20px; margin-bottom: 4px; }
  .protocol-hours { font-weight: 800; font-size: 20px; margin-bottom: 2px; }
  .protocol-card.fast-p .protocol-hours { color: var(--orange); }
  .protocol-card.eat-p .protocol-hours { color: var(--green); }
  .protocol-desc { font-size: 11px; color: var(--muted); }
  .fast-history-title { font-weight: 700; color: #fff; font-size: 14px; margin-bottom: 9px; }
  .fast-hist-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 13px; border-radius: 10px; background: var(--card); margin-bottom: 6px; }
  .fast-hist-item.achieved { border: 1px solid rgba(34,197,94,0.2); }
  .fast-hist-item.missed { border: 1px solid rgba(239,68,68,0.2); }
  .fast-hist-date { font-size: 13px; font-weight: 600; color: #ddd; }
  .fast-hist-dur { font-size: 12px; color: var(--muted); }
  .fast-hist-badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 6px; }
  .fast-hist-badge.achieved { color: var(--green); background: rgba(34,197,94,0.1); }
  .fast-hist-badge.missed { color: var(--red); background: rgba(239,68,68,0.1); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--dim); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  select.form-input option { background: #13131f; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="logo">🏋️</div>
    <div>
      <div class="logo-text">GymTracker</div>
      <div class="logo-date" id="header-date"></div>
    </div>
  </div>

  <!-- WORKOUT TAB -->
  <div id="tab-workout" class="tab active">
    <div class="day-grid">
      <button class="day-btn" data-day="Chest" onclick="selectDay('Chest')"><span class="day-emoji">💪</span>Chest</button>
      <button class="day-btn" data-day="Shoulders" onclick="selectDay('Shoulders')"><span class="day-emoji">🏋️</span>Shoulders</button>
      <button class="day-btn" data-day="Legs" onclick="selectDay('Legs')"><span class="day-emoji">🦵</span>Legs</button>
      <button class="day-btn" data-day="Back & Biceps" onclick="selectDay('Back & Biceps')"><span class="day-emoji">🔄</span><span style="text-align:center;line-height:1.2">Back &amp; Biceps</span></button>
    </div>
    <div class="session-bar">
      <div class="session-info">
        <div class="ring-wrap">
          <svg width="46" height="46" viewBox="0 0 46 46" style="transform:rotate(-90deg)">
            <circle cx="23" cy="23" r="19" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="3.5"/>
            <circle id="progress-ring" cx="23" cy="23" r="19" fill="none" stroke="#f97316" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="119.4" stroke-dashoffset="119.4" style="transition:stroke-dashoffset 0.4s"/>
          </svg>
          <div class="ring-text" id="ring-pct">0%</div>
        </div>
        <div>
          <div class="session-title" id="session-title">💪 Chest</div>
          <div class="session-sub" id="session-sub">0 of 6 done</div>
        </div>
      </div>
      <button class="btn btn-start" id="session-btn" onclick="toggleSession()">Start</button>
    </div>
    <div id="exercise-list"></div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" class="tab">
    <div id="history-list"></div>
  </div>

  <!-- REMINDERS TAB -->
  <div id="tab-reminder" class="tab">
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">LAST SESSION</div>
        <div id="last-session-day" class="stat-val">—</div>
        <div id="last-session-date" class="stat-sub"></div>
        <div id="last-session-done" class="stat-sub" style="color:var(--green);margin-top:4px"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label" id="today-label">TODAY</div>
        <div id="today-reminder" class="stat-val" style="color:var(--orange)">—</div>
        <div id="total-sessions" class="stat-sub"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">🔔 Add Reminder</div>
      <div class="form-grid">
        <div>
          <div class="form-label">DAY</div>
          <select id="rem-day" class="form-input">
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </div>
        <div>
          <div class="form-label">TIME</div>
          <input type="time" id="rem-time" class="form-input" value="07:00"/>
        </div>
      </div>
      <div>
        <div class="form-label">LABEL</div>
        <input type="text" id="rem-label" class="form-input" value="Gym Session" style="margin-bottom:9px"/>
      </div>
      <button class="btn-full" onclick="addReminder()">+ Add Reminder</button>
    </div>
    <div id="reminder-list"></div>
  </div>

  <!-- FASTING TAB -->
  <div id="tab-fasting" class="tab">
    <div class="fast-header">
      <div>
        <div class="fast-title">Intermittent Fasting</div>
        <div class="fast-sub">16:8 Protocol</div>
      </div>
      <div class="streak-badge">🔥 <span id="streak-count">0</span> day streak</div>
    </div>
    <div class="fast-card">
      <div class="fast-ring">
        <svg width="180" height="180" viewBox="0 0 180 180" style="transform:rotate(-90deg)">
          <circle cx="90" cy="90" r="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="10"/>
          <circle id="fast-ring" cx="90" cy="90" r="80" fill="none" stroke="#f97316" stroke-width="10" stroke-linecap="round" stroke-dasharray="502.7" stroke-dashoffset="502.7" style="transition:stroke-dashoffset 1s linear,stroke 0.5s"/>
        </svg>
        <div class="fast-ring-text">
          <div class="fast-time" id="fast-timer" style="color:#444">16:00</div>
          <div class="fast-elapsed" id="fast-elapsed">Not fasting</div>
          <div class="fast-remaining" id="fast-remaining"></div>
          <div class="fast-reached" id="fast-reached" style="display:none">✓ 16h reached!</div>
        </div>
      </div>
      <div class="fast-windows" id="fast-windows" style="display:none">
        <div class="fast-window start">
          <div class="fast-window-label">FAST STARTED</div>
          <div class="fast-window-time" id="fast-start-time">—</div>
        </div>
        <div class="fast-window eat">
          <div class="fast-window-label">EAT FROM</div>
          <div class="fast-window-time" id="fast-eat-time">—</div>
          <div class="fast-window-sub" id="fast-eat-end">—</div>
        </div>
      </div>
      <button class="btn-fast" id="fast-btn" onclick="toggleFast()" style="background:var(--orange);box-shadow:0 4px 20px rgba(249,115,22,0.3)">Start Fast</button>
    </div>
    <div class="protocol-grid">
      <div class="protocol-card fast-p"><div class="protocol-icon">🌙</div><div class="protocol-hours">16h</div><div class="protocol-desc">Fasting window</div></div>
      <div class="protocol-card eat-p"><div class="protocol-icon">☀️</div><div class="protocol-hours">8h</div><div class="protocol-desc">Eating window</div></div>
    </div>
    <div id="fast-history"></div>
  </div>
</div>

<!-- Bottom Nav -->
<nav class="nav">
  <button class="nav-btn active" id="nav-workout" onclick="switchTab('workout')">
    <span class="nav-icon">🏋️</span><span>Workout</span><div class="nav-dot"></div>
  </button>
  <button class="nav-btn" id="nav-history" onclick="switchTab('history')">
    <span class="nav-icon">📋</span><span>History</span><div class="nav-dot" style="display:none"></div>
  </button>
  <button class="nav-btn" id="nav-reminder" onclick="switchTab('reminder')">
    <span class="nav-icon">🔔</span><span>Schedule</span><div class="nav-dot" style="display:none"></div>
  </button>
  <button class="nav-btn" id="nav-fasting" onclick="switchTab('fasting')">
    <span class="nav-icon">🔥</span><span>Fasting</span><div class="nav-dot" style="display:none"></div>
  </button>
</nav>

<script>
// ── Data ──────────────────────────────────────────────────────────────────────
const WORKOUTS = {
  "Chest": [
    { id:"ch_1", exercise:"Chest Press", weight:59, sets:3, reps:"10-12", rest:"60 sec", session:2 },
    { id:"ch_2", exercise:"Pec Fly", weight:100, sets:3, reps:"12-15", rest:"45 sec", session:1 },
    { id:"ch_3", exercise:"Converging Shoulder Press", weight:25, sets:3, reps:"10-12", rest:"60 sec", session:2, weightNote:"23–27 kg" },
    { id:"ch_4", exercise:"Triceps Pushdown", weight:64, sets:3, reps:"10-12", rest:"45 sec", session:2 },
    { id:"ch_5", exercise:"Lateral Raise", weight:41, sets:3, reps:"10-12", rest:"1 min" },
    { id:"ch_6", exercise:"Chest Press (Converging)", weight:64, sets:3, reps:"10-12", rest:"60 sec", equipment:"Converging Chest Press" },
  ],
  "Shoulders": [
    { id:"sh_1", exercise:"Machine Shoulder Press", weight:60, sets:4, reps:"6-10", rest:"90 sec", equipment:"Plate/Selectorized Machine", purpose:"Main mass builder" },
    { id:"sh_2", exercise:"Seated Dumbbell Shoulder Press", weight:16, sets:3, reps:"8-12", rest:"75 sec", equipment:"Dumbbells", purpose:"Front & side delt thickness", weightNote:"16 kg x2" },
    { id:"sh_3", exercise:"Dumbbell Lateral Raise", weight:59, sets:3, reps:"12-15", rest:"60 sec", equipment:"Dumbbells", purpose:"Roundness and volume" },
    { id:"sh_4", exercise:"Rear Delt Fly Machine", weight:73, sets:4, reps:"12-15", rest:"60 sec", equipment:"Reverse Pec Deck Machine", purpose:"3D shape & balance" },
    { id:"sh_5", exercise:"Face Pull", weight:67.5, sets:3, reps:"12-15", rest:"60 sec", equipment:"Cable + Rope", purpose:"Rear delts + shoulder health" },
    { id:"sh_6", exercise:"Front Raise (Optional)", weight:15, sets:3, reps:"10-12", rest:"60 sec", equipment:"Plate or Dumbbells", purpose:"Extra front delt" },
  ],
  "Legs": [
    { id:"lg_1", exercise:"Leg Press", weight:86, sets:4, reps:"10-12", rest:"90 sec", session:2 },
    { id:"lg_2", exercise:"Leg Extension", weight:32, sets:3, reps:"10-12", rest:"60 sec", session:2 },
    { id:"lg_3", exercise:"Hip Adduction", weight:52, sets:3, reps:"10-12", rest:"1 min", session:1 },
    { id:"lg_4", exercise:"Seated Leg Curl", weight:45, sets:3, reps:"10-12", rest:"60 sec", session:1 },
    { id:"lg_5", exercise:"Ab Crunch", weight:91, sets:3, reps:"15-20", rest:"30 sec", session:1 },
    { id:"lg_6", exercise:"Back Extension", weight:86, sets:2, reps:"12", rest:"45 sec", session:1 },
  ],
  "Back & Biceps": [
    { id:"bb_1", exercise:"Lat Pulldown", weight:66, sets:3, reps:"10-12", rest:"60 sec", session:2 },
    { id:"bb_2", exercise:"Seated Row", weight:59, sets:3, reps:"10-12", rest:"60 sec", session:2 },
    { id:"bb_3", exercise:"Biceps Curl", weight:36, sets:3, reps:"10-12", rest:"45 sec", session:2 },
    { id:"bb_4", exercise:"Hammer Curls", weight:12, sets:3, reps:"10-12", rest:"", weightNote:"12 kg x2" },
    { id:"bb_5", exercise:"45 Degree Curls", weight:12, sets:3, reps:"10-12", rest:"", weightNote:"12 kg x2" },
    { id:"bb_6", exercise:"Sevens", weight:20, sets:3, reps:"7x3", rest:"" },
  ],
};

const DAY_COLORS = { "Chest":"chest","Shoulders":"shoulders","Legs":"legs","Back & Biceps":"back" };
  const DAY_ICONS  = { "Chest":"💪","Shoulders":"🏋️","Legs":"🦵","Back & Biceps":"💪" };
const ACCENT     = { "Chest":"#3b82f6","Shoulders":"#a855f7","Legs":"#f97316","Back & Biceps":"#22c55e" };
const MOODS = [
  { id:"great", emoji:"😄", label:"Great",  color:"#22c55e" },
  { id:"good",  emoji:"🙂", label:"Good",   color:"#84cc16" },
  { id:"ok",    emoji:"😐", label:"OK",     color:"#eab308" },
  { id:"tough", emoji:"😓", label:"Tough",  color:"#f97316" },
  { id:"bad",   emoji:"😞", label:"Rough",  color:"#ef4444" },
];

// ── State ─────────────────────────────────────────────────────────────────────
function load(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

let workouts   = load("ght_workouts", JSON.parse(JSON.stringify(WORKOUTS)));
let activeDay  = "Chest";
let checked    = load("ght_checked", {});
let moods      = load("ght_moods", {});
let sessionLog = load("ght_log", []);
let reminders  = load("ght_reminders", []);
let activeFast = load("ght_active_fast", null);
let fasts      = load("ght_fasts", []);
let sessionActive = false;
let expandedCard  = null;
let fastInterval  = null;

function todayKey(day){ return day+"_"+new Date().toISOString().split("T")[0]; }
function dayChecked(){ return checked[todayKey(activeDay)]||{}; }
function dayMoods(){ return moods[todayKey(activeDay)]||{}; }

// ── Date ──────────────────────────────────────────────────────────────────────
document.getElementById("header-date").textContent =
  new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const todayName = new Date().toLocaleDateString("en-GB",{weekday:"long"});
document.getElementById("today-label").textContent = "TODAY · "+todayName.toUpperCase();

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(name){
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.querySelectorAll(".nav-btn").forEach(b=>{ b.classList.remove("active"); b.querySelector(".nav-dot").style.display="none"; });
  document.getElementById("tab-"+name).classList.add("active");
  const nb = document.getElementById("nav-"+name);
  nb.classList.add("active");
  nb.querySelector(".nav-dot").style.display="block";
  if(name==="history") renderHistory();
  if(name==="reminder") renderReminders();
  if(name==="fasting") renderFastHistory();
}

// ── Day selection ─────────────────────────────────────────────────────────────
function selectDay(day){
  activeDay = day;
  expandedCard = null;
  document.querySelectorAll(".day-btn").forEach(b=>{
    b.className = "day-btn";
    if(b.dataset.day===day) b.classList.add("active-"+DAY_COLORS[day]);
  });
  renderExercises();
  updateSessionBar();
}

// ── Exercise rendering ────────────────────────────────────────────────────────
function renderExercises(){
  const list = document.getElementById("exercise-list");
  const exs  = workouts[activeDay]||[];
  const dc   = dayChecked();
  const dm   = dayMoods();
  const acc  = ACCENT[activeDay];
  list.innerHTML = "";

  exs.forEach(ex=>{
    const done = !!dc[ex.id];
    const mood = dm[ex.id]||null;
    const moodObj = mood ? MOODS.find(m=>m.id===mood) : null;
    const isOpen = expandedCard === ex.id;

    const card = document.createElement("div");
    card.className = "ex-card"+(done?" done":"")+(isOpen?" open":"");
    card.id = "card-"+ex.id;

    // Header
    card.innerHTML = `
      <div class="ex-header" onclick="toggleCard('${ex.id}')">
        <button class="ex-check" id="chk-${ex.id}"
          onclick="event.stopPropagation();toggleCheck('${ex.id}')"
          style="border-color:${done?acc:"rgba(255,255,255,0.2)"};background:${done?acc:"transparent"}">
          ${done?"✓":""}
        </button>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
            <span class="ex-name">${ex.exercise}</span>
            ${moodObj?`<span class="ex-mood-badge">${moodObj.emoji}</span>`:""}
          </div>
          <div class="ex-stats">${ex.sets} × ${ex.reps} · ${ex.weight}kg${ex.rest?" · "+ex.rest:""}</div>
        </div>
        <div class="ex-right">
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="ex-body">
        <div class="detail-grid">
          <div class="detail-cell"><div class="detail-label">SETS</div><div class="detail-val">${ex.sets}</div></div>
          <div class="detail-cell"><div class="detail-label">REPS</div><div class="detail-val">${ex.reps}</div></div>
          <div class="detail-cell"><div class="detail-label">REST</div><div class="detail-val">${ex.rest||"—"}</div></div>
        </div>
        <div class="weight-section">
          <div class="section-label">WEIGHT</div>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <div class="weight-editor" id="weditor-${ex.id}" onclick="startWeightEdit('${ex.id}')">
              <span class="weight-val" id="wval-${ex.id}">${ex.weight}</span>
              <span class="weight-unit">kg</span>
              <span class="weight-edit-icon">✎</span>
            </div>
            <div class="weight-input-wrap" id="winput-${ex.id}">
              <input type="number" step="0.5" class="weight-input" id="winputfield-${ex.id}"
                value="${ex.weight}"
                onblur="saveWeight('${ex.id}')"
                onkeydown="if(event.key==='Enter')saveWeight('${ex.id}');if(event.key==='Escape')cancelWeight('${ex.id}')"/>
              <span style="font-size:12px;color:#aaa">kg</span>
            </div>
            ${ex.weightNote?`<span class="weight-note">${ex.weightNote}</span>`:""}
          </div>
        </div>
        ${ex.purpose?`<div class="purpose-note">💡 ${ex.purpose}</div>`:""}
        <div class="mood-section">
          <div class="section-label">HOW DID IT FEEL?</div>
          ${done ? `
            <div class="mood-grid" id="moodgrid-${ex.id}">
              ${MOODS.map(m=>`
                <button class="mood-btn" id="mood-${ex.id}-${m.id}"
                  onclick="setMood('${ex.id}','${m.id}')"
                  style="${mood===m.id?`border-color:${m.color};background:${m.color}22;box-shadow:0 0 12px ${m.color}55`:""}">
                  <span class="mood-emoji">${m.emoji}</span>
                  <span class="mood-label" style="${mood===m.id?`color:${m.color}`:""}">${m.label}</span>
                </button>`).join("")}
            </div>` :
            `<div class="mood-prompt">Tick the exercise to rate how it felt</div>`
          }
        </div>
      </div>`;

    // Border colour when done
    if(done) card.style.borderColor = acc+"55";
    if(done) card.style.background  = acc+"0e";

    list.appendChild(card);
  });
}

function toggleCard(id){
  expandedCard = expandedCard===id ? null : id;
  renderExercises();
}

function toggleCheck(id){
  const key = todayKey(activeDay);
  if(!checked[key]) checked[key]={};
  checked[key][id] = !checked[key][id];
  save("ght_checked",checked);
  renderExercises();
  updateSessionBar();
}

function setMood(exId, moodId){
  const key = todayKey(activeDay);
  if(!moods[key]) moods[key]={};
  moods[key][exId] = moods[key][exId]===moodId ? null : moodId;
  save("ght_moods",moods);
  renderExercises();
}

function startWeightEdit(id){
  document.getElementById("weditor-"+id).classList.add("hide");
  const wrap = document.getElementById("winput-"+id);
  wrap.classList.add("show");
  const input = document.getElementById("winputfield-"+id);
  input.focus(); input.select();
}

function saveWeight(id){
  const input = document.getElementById("winputfield-"+id);
  const val = parseFloat(input.value);
  if(!isNaN(val)){
    workouts[activeDay] = workouts[activeDay].map(e=>e.id===id?{...e,weight:val}:e);
    save("ght_workouts",workouts);
  }
  document.getElementById("weditor-"+id).classList.remove("hide");
  document.getElementById("winput-"+id).classList.remove("show");
  if(!isNaN(val)) document.getElementById("wval-"+id).textContent=val;
  renderExercises();
}

function cancelWeight(id){
  document.getElementById("weditor-"+id).classList.remove("hide");
  document.getElementById("winput-"+id).classList.remove("show");
}

// ── Session ───────────────────────────────────────────────────────────────────
function updateSessionBar(){
  const exs = workouts[activeDay]||[];
  const dc  = dayChecked();
  const done = exs.filter(e=>dc[e.id]).length;
  const pct  = exs.length ? Math.round(done/exs.length*100) : 0;
  const circ = 2*Math.PI*19;
  document.getElementById("progress-ring").style.strokeDashoffset = circ*(1-done/(exs.length||1));
  document.getElementById("progress-ring").style.stroke = ACCENT[activeDay];
  document.getElementById("ring-pct").textContent = pct+"%";
  document.getElementById("session-title").textContent = DAY_ICONS[activeDay]+" "+activeDay;
  document.getElementById("session-sub").textContent = done+" of "+exs.length+" done";
}

function toggleSession(){
  const btn = document.getElementById("session-btn");
  if(!sessionActive){
    sessionActive = true;
    const key = todayKey(activeDay);
    checked[key]={};
    moods[key]={};
    save("ght_checked",checked);
    save("ght_moods",moods);
    btn.textContent="Save";
    btn.className="btn btn-save";
    expandedCard=null;
    renderExercises();
    updateSessionBar();
  } else {
    const exs = workouts[activeDay]||[];
    const dc  = dayChecked();
    const dm  = dayMoods();
    sessionLog.unshift({
      id:Date.now(), day:activeDay,
      date:new Date().toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}),
      dateISO:new Date().toISOString().split("T")[0],
      completed:exs.filter(e=>dc[e.id]).length,
      total:exs.length,
      exercises:exs.map(e=>({name:e.exercise,weight:e.weight,done:!!dc[e.id],mood:dm[e.id]||null})),
    });
    save("ght_log",sessionLog);
    sessionActive=false;
    btn.textContent="Start";
    btn.className="btn btn-start";
    btn.style.background=ACCENT[activeDay];
    btn.style.boxShadow="0 4px 14px "+ACCENT[activeDay]+"55";
  }
}

// ── History ───────────────────────────────────────────────────────────────────
let histExpanded = null;
function renderHistory(){
  const list = document.getElementById("history-list");
  if(!sessionLog.length){
    list.innerHTML=`<div class="empty-state"><div class="empty-icon">🏋️</div><p>No sessions yet. Complete a workout to see history.</p></div>`;
    return;
  }
  list.innerHTML = `<div style="font-size:13px;color:var(--dim);margin-bottom:10px">${sessionLog.length} session${sessionLog.length!==1?"s":""} recorded</div>`;
  sessionLog.forEach(s=>{
    const acc = ACCENT[s.day]||"#888";
    const isOpen = histExpanded===s.id;
    const card = document.createElement("div");
    card.className = "hist-card"+(isOpen?" open":"");
    card.innerHTML = `
      <div class="hist-header" onclick="toggleHist(${s.id})" style="border-left:3px solid ${acc}">
        <div>
          <div class="hist-day">${DAY_ICONS[s.day]||""} ${s.day}</div>
          <div class="hist-date">${s.date}</div>
        </div>
        <div class="hist-right">
          <div class="hist-count" style="color:${acc}">${s.completed}/${s.total}</div>
          <span class="chevron">▾</span>
        </div>
      </div>
      ${isOpen?`<div class="hist-body">
        ${s.exercises.map(e=>{
          const mo = MOODS.find(m=>m.id===e.mood);
          return `<div class="hist-ex${e.done?" done":""}">
            <div class="hist-ex-left">
              <span style="color:${e.done?acc:"#444"}">${e.done?"✓":"–"}</span>
              <span style="color:${e.done?"#ccc":"#555"}">${e.name}</span>
            </div>
            <div class="hist-ex-right">
              <span>${e.weight}kg</span>
              ${mo?`<span style="font-size:17px">${mo.emoji}</span>`:""}
            </div>
          </div>`;
        }).join("")}
      </div>`:""}`;
    list.appendChild(card);
  });
}

function toggleHist(id){
  histExpanded = histExpanded===id ? null : id;
  renderHistory();
}

// ── Reminders ─────────────────────────────────────────────────────────────────
function renderReminders(){
  const last = sessionLog[0];
  document.getElementById("last-session-day").textContent   = last ? last.day : "No sessions yet";
  document.getElementById("last-session-date").textContent  = last ? last.date : "";
  document.getElementById("last-session-done").textContent  = last ? last.completed+"/"+last.total+" done" : "";
  const todayRems = reminders.filter(r=>r.day===todayName);
  document.getElementById("today-reminder").textContent = todayRems.length ? todayRems.map(r=>r.label+" @ "+r.time).join(", ") : "No reminders set";
  document.getElementById("total-sessions").textContent = sessionLog.length+" sessions total";

  const list = document.getElementById("reminder-list");
  list.innerHTML="";
  reminders.forEach(r=>{
    const isToday = r.day===todayName;
    const item = document.createElement("div");
    item.className = "reminder-item"+(isToday?" today":"");
    item.innerHTML = `
      <div>
        <div class="reminder-day">${r.day} @ ${r.time}</div>
        <div class="reminder-label">${r.label}</div>
      </div>
      <button class="btn-remove" onclick="removeReminder(${r.id})">Remove</button>`;
    list.appendChild(item);
  });
}

function addReminder(){
  const day   = document.getElementById("rem-day").value;
  const time  = document.getElementById("rem-time").value;
  const label = document.getElementById("rem-label").value.trim();
  if(!label) return;
  reminders.push({id:Date.now(),day,time,label});
  save("ght_reminders",reminders);
  renderReminders();
}

function removeReminder(id){
  reminders = reminders.filter(r=>r.id!==id);
  save("ght_reminders",reminders);
  renderReminders();
}

// ── Fasting ───────────────────────────────────────────────────────────────────
const FAST_H=16, EAT_H=8, CIRC=2*Math.PI*80;

function toggleFast(){
  if(!activeFast){
    activeFast={start:Date.now()};
    save("ght_active_fast",activeFast);
    startFastTimer();
  } else {
    const dur=(Date.now()-activeFast.start)/3600000;
    fasts.unshift({id:Date.now(),start:activeFast.start,end:Date.now(),durationHours:Math.round(dur*10)/10,achieved:dur>=FAST_H,date:new Date(activeFast.start).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})});
    save("ght_fasts",fasts);
    activeFast=null;
    save("ght_active_fast",null);
    clearInterval(fastInterval);
    resetFastUI();
    renderFastHistory();
  }
}

function startFastTimer(){
  clearInterval(fastInterval);
  fastInterval = setInterval(updateFastUI,1000);
  updateFastUI();
}

function updateFastUI(){
  if(!activeFast) return;
  const now = Date.now();
  const elapsed = (now-activeFast.start)/3600000;
  const progress = Math.min(elapsed/FAST_H,1);
  const remaining = Math.max(0,FAST_H*3600000-(now-activeFast.start));
  const eatStart = new Date(activeFast.start+FAST_H*3600000);
  const eatEnd   = new Date(activeFast.start+(FAST_H+EAT_H)*3600000);

  document.getElementById("fast-ring").style.strokeDashoffset = CIRC*(1-progress);
  document.getElementById("fast-ring").style.stroke = progress>=1?"#22c55e":"#f97316";
  document.getElementById("fast-timer").textContent = hms(now-activeFast.start);
  document.getElementById("fast-timer").style.color = progress>=1?"#22c55e":"#f97316";
  document.getElementById("fast-elapsed").textContent = elapsed.toFixed(1)+"h elapsed";
  document.getElementById("fast-remaining").textContent = remaining>0?"−"+hms(remaining)+" left":"";
  document.getElementById("fast-reached").style.display = progress>=1?"block":"none";
  document.getElementById("fast-windows").style.display = "grid";
  document.getElementById("fast-start-time").textContent = ft(new Date(activeFast.start));
  document.getElementById("fast-eat-time").textContent = ft(eatStart);
  document.getElementById("fast-eat-end").textContent = "until "+ft(eatEnd);
  document.getElementById("fast-btn").textContent = "End Fast";
  document.getElementById("fast-btn").style.background = "#ef4444";
  document.getElementById("fast-btn").style.boxShadow = "0 4px 20px rgba(239,68,68,0.3)";
  document.getElementById("streak-count").textContent = calcStreak();
}

function resetFastUI(){
  document.getElementById("fast-ring").style.strokeDashoffset = CIRC;
  document.getElementById("fast-ring").style.stroke = "#f97316";
  document.getElementById("fast-timer").textContent = "16:00";
  document.getElementById("fast-timer").style.color = "#444";
  document.getElementById("fast-elapsed").textContent = "Not fasting";
  document.getElementById("fast-remaining").textContent = "";
  document.getElementById("fast-reached").style.display = "none";
  document.getElementById("fast-windows").style.display = "none";
  document.getElementById("fast-btn").textContent = "Start Fast";
  document.getElementById("fast-btn").style.background = "#f97316";
  document.getElementById("fast-btn").style.boxShadow = "0 4px 20px rgba(249,115,22,0.3)";
  document.getElementById("streak-count").textContent = calcStreak();
}

function renderFastHistory(){
  document.getElementById("streak-count").textContent = calcStreak();
  const el = document.getElementById("fast-history");
  if(!fasts.length){ el.innerHTML=""; return; }
  el.innerHTML = `<div class="fast-history-title">Recent Fasts</div>`+
    fasts.slice(0,7).map(f=>`
      <div class="fast-hist-item ${f.achieved?"achieved":"missed"}">
        <div><div class="fast-hist-date">${f.date}</div><div class="fast-hist-dur">${f.durationHours}h fasted</div></div>
        <span class="fast-hist-badge ${f.achieved?"achieved":"missed"}">${f.achieved?"✓ 16h+":f.durationHours+"h"}</span>
      </div>`).join("");
}

function calcStreak(){ let s=0; for(const f of fasts){ if(f.achieved) s++; else break; } return s; }
function hms(ms){ const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),s=Math.floor(ms%60000/1000); return String(h).padStart(2,"0")+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); }
function ft(d){ return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }

// ── Init ──────────────────────────────────────────────────────────────────────
selectDay("Chest");
if(activeFast) startFastTimer(); else resetFastUI();
renderFastHistory();

// Style the start button for the default day
const sb = document.getElementById("session-btn");
sb.style.background = ACCENT["Chest"];
sb.style.boxShadow = "0 4px 14px rgba(59,130,246,0.4)";
</script>
